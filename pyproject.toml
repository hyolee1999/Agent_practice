[project]
name = "docuagent"
version = "0.1.0"
description = "Production-grade Document RAG Agent with Hybrid Search, Observability, and Multi-Interface Serving"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bm25s>=0.3.10",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.7.0",
    "langchain-classic>=1.0.8",
    "langchain-cohere>=0.6.0",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-experimental>=0.4.2",
    "langchain-google-vertexai>=3.2.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.5",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "ragas>=0.4.3",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
docuagent-api = "docuagent.api.app:run_server"
docuagent-ui = "docuagent.ui.cli:run_ui"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
